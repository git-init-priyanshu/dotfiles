# true colours support
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# Mouse support
set -g mouse on

# Reload tmux config
unbind r
bind r source-file ~/.tmux.conf

# New prefix
unbind C-b
set-option -g prefix C-Space
bind-key C-Space send-prefix

# Vim style pane selection
bind h select-pane -L
bind j select-pane -D 
bind k select-pane -U
bind l select-pane -R

# Start windows and panes at 1, not 0
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# Use Alt-arrow keys without prefix key to switch panes
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# smart-splits.nvim navigation: forward C-h/j/k/l to vim when @pane-is-vim is set
bind -n C-h if -F "#{@pane-is-vim}" 'send-keys C-h' 'select-pane -L'
bind -n C-j if -F "#{@pane-is-vim}" 'send-keys C-j' 'select-pane -D'
bind -n C-k if -F "#{@pane-is-vim}" 'send-keys C-k' 'select-pane -U'
bind -n C-l if -F "#{@pane-is-vim}" 'send-keys C-l' 'select-pane -R'

# smart-splits.nvim resize bindings (Ctrl+Shift+Alt+arrow)
bind -n C-M-S-Left  if -F "#{@pane-is-vim}" 'send-keys C-M-S-Left'  'resize-pane -L 3'
bind -n C-M-S-Down  if -F "#{@pane-is-vim}" 'send-keys C-M-S-Down'  'resize-pane -D 3'
bind -n C-M-S-Up    if -F "#{@pane-is-vim}" 'send-keys C-M-S-Up'    'resize-pane -U 3'
bind -n C-M-S-Right if -F "#{@pane-is-vim}" 'send-keys C-M-S-Right' 'resize-pane -R 3'

# Shift arrow to switch windows
bind -n S-Left  previous-window
bind -n S-Right next-window

# Shift Alt vim keys to switch windows
bind -n S-F11 previous-window
bind -n S-F12 next-window

# Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'maxpetretta/tmux-monokai-pro'
set -g @monokai-show-left-icon "#S"
set -g @monokai-show-powerline true
set -g @monokai-show-left-sep 
set -g @monokai-show-right-sep 

# set vi-mode
set-window-option -g mode-keys vi
# keybindings
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# Open panes and windows in current directory
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Current window name bold
set -g window-status-current-style fg=terminal,bold

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
